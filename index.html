<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>MathCrush</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- Background canvases (z-index 0 and 50) -->
  <canvas id="bg-canvas"></canvas>
  <canvas id="particle-canvas"></canvas>

  <!-- Main game UI -->
  <div id="app">

    <!-- Header: level / score / best -->
    <div id="header">
      <div class="hbadge" id="lvl-badge">LVL <span id="lvl-num">1</span></div>
      <div class="hbadge" id="score-badge">⭐ <span id="score-val">0</span></div>
      <div class="hbadge" id="best-badge">🏆 <span id="best-val">0</span></div>
    </div>

    <!-- Target number card -->
    <div id="target-card">
      <div id="target-label">make this number</div>
      <div id="target-num">—</div>
      <div id="mode-pill">sum mode</div>
    </div>

    <!-- XP progress bar -->
    <div id="xp-row">
      <div id="xp-wrap"><div id="xp-fill" style="width:0%"></div></div>
      <div id="xp-txt">0 / 300 to level up</div>
    </div>

    <!-- Timer bar -->
    <div id="timer-row">
      <div id="timer-wrap"><div id="timer-fill"></div></div>
      <div id="timer-txt">30s</div>
    </div>

    <!-- Current equation / selection display -->
    <div id="eq-bar">
      <div id="eq-chips">
        <span class="placeholder">tap tiles to build an equation</span>
      </div>
      <div id="eq-result">—</div>
    </div>

    <!-- 4×4 tile grid (populated by JS) -->
    <div id="grid"></div>

    <!-- Action buttons -->
    <div id="btn-row">
      <button class="btn" id="btn-clear">✕ Clear</button>
      <button class="btn" id="btn-go" disabled>Check it! →</button>
    </div>

  </div><!-- /#app -->

  <!-- Game over overlay -->
  <div id="screen-over">
    <div class="over-card">
      <div class="over-star">⭐</div>
      <div class="over-title">Game Over!</div>
      <div class="over-sub">You reached level <span id="over-lvl">1</span></div>
      <div class="stat-row">
        <div class="stat-box">
          <div class="sl">Score</div>
          <div class="sv" id="over-score">0</div>
        </div>
        <div class="stat-box">
          <div class="sl">Best ever</div>
          <div class="sv" id="over-best">0</div>
        </div>
      </div>
      <button id="btn-restart">Play Again 🚀</button>
    </div>
  </div>

  <!-- JS modules (order matters: audio + visuals before game) -->
  <script src="js/audio.js"></script>
  <script src="js/visuals.js"></script>
  <script src="js/game.js"></script>

</body>
</html>
